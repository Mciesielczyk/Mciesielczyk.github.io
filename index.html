<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Michał</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container text-end mt-3">
    <button id="lang-btn" class="btn btn-lang">EN</button>
</div>

<div class="container">
    <header class="text-center py-5">
        <img id="profile-avatar" src="" alt="Awatar" class="avatar-img mb-3">
        <h1 class="display-4 fw-bold"><span data-i18n="greeting">Cześć, jestem</span> <span id="header-name" style="color: #00d4ff;">...</span></h1>
        <p id="header-role" class="lead text-secondary">...</p>
    </header>

    <section id="about" class="mb-5 text-center">
        <h2 class="fw-bold mb-4" data-i18n="about-title">O mnie</h2>
        <p id="about-description" class="mx-auto" style="max-width: 700px; line-height: 1.7;">...</p>
    </section>

    <section id="skills" class="py-5 mb-5 rounded-4 shadow-sm" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);">
        <div class="container text-center">
            <h2 class="fw-bold mb-5" data-i18n="skills-title">Stack Technologiczny</h2>
            <div id="skills-container" class="d-flex flex-wrap justify-content-center gap-4">
            </div>
        </div>
    </section>

    <section id="projects" class="py-5">
        <h2 class="mb-5 fw-bold text-center" data-i18n="projects-title">Wybrane projekty</h2>
        <div id="projects-container" class="row g-4">
        </div>
    </section>

    <section id="experience" class="mb-5 py-5">
        <h2 class="fw-bold text-center mb-5" data-i18n="experience-title">Doświadczenie</h2>

        <div id="experience-list-it" class="mx-auto" style="max-width: 800px;"></div>

        <div class="text-center mt-4">
            <button id="toggle-other-exp" class="btn btn-outline-secondary btn-sm" data-i18n="toggle-exp">
                Pokaż inne doświadczenie
            </button>
        </div>

        <div id="experience-list-other" class="mx-auto mt-3 collapse" style="max-width: 800px;"></div>
    </section>

    <footer id="contact" class="py-5 border-top border-secondary mt-5">
        <div class="container text-center">
            <h2 class="fw-bold mb-5" data-i18n="contact-title">Kontakt</h2>

            <div class="contact-details">
                <div id="contact-email"></div>
                <div id="contact-phone"></div>
                <div class="w-100"><a id="linkedin-link" target="_blank"></a></div>
                <div class="w-100"><a id="github-link" target="_blank"></a></div>
            </div>
        </div>
    </footer>
</div>

<div class="modal fade" id="skillModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-info" style="border: 2px solid #00d4ff;">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="skillModalTitle">Szczegóły</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="skillModalBody" style="font-size: 1.1rem; opacity: 0.9;">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="scripts/script.js"></script>

</body>
</html>
